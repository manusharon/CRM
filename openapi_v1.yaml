openapi: 3.0.3
info:
  title: Travel OS - Core API (v1)
  version: "1.0.0"
servers:
  - url: https://api.yourplatform.com/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        mobile:
          type: string
        preferred_language:
          type: string
        preferred_currency:
          type: string
    Agency:
      type: object
      properties:
        id: string
        name: string
        state: string
        city: string
        status: string
        specialization_countries:
          type: array
          items: { type: string }
    VisaRequest:
      type: object
      properties:
        id: string
        user_id: string
        country: string
        visa_type: string
        travel_dates:
          type: object
          properties:
            from: string
            to: string
        documents:
          type: array
          items:
            type: string
        status: string
    ChatSession:
      type: object
      properties:
        id: string
        user_id: string
        agency_id: string
        status: string
    Message:
      type: object
      properties:
        id: string
        session_id: string
        sender_type: string
        text: string
paths:
  /auth/signup:
    post:
      summary: Sign up with email/mobile + OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                mobile: { type: string }
                password: { type: string }
                preferred_language: { type: string }
                preferred_currency: { type: string }
      responses:
        '201':
          description: Created, OTP sent
  /auth/login:
    post:
      summary: Login (email/mobile + password or OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                mobile: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Returns JWT access & refresh
  /users/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /agencies/apply:
    post:
      summary: Agency apply flow (create agency record)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                primary_contact_name: { type: string }
                email: { type: string }
                mobile: { type: string }
                state: { type: string }
                city: { type: string }
                gst_document: { type: string, format: binary }
                pan_document: { type: string, format: binary }
      responses:
        '201':
          description: Agency application received
  /agencies/{agencyId}/verify:
    post:
      summary: Admin verifies an agency
      parameters:
        - name: agencyId
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Agency verified
  /visas/requests:
    post:
      summary: Create a visa request (customer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                country: { type: string }
                visa_type: { type: string }
                travel_from: { type: string, format: date }
                travel_to: { type: string, format: date }
                documents: 
                  type: array
                  items:
                    type: string
                    format: binary
                max_agencies_to_ping:
                  type: integer
      responses:
        '201':
          description: Visa request created; matching job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisaRequest'
  /visas/requests/{id}:
    get:
      summary: Get visa request status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        '200':
          description: visa request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisaRequest'
  /visas/requests/{id}/agency-response:
    post:
      summary: Agency accepts/rejects a dispatched visa lead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agency_id: { type: string }
                action: { type: string, enum: ['accept','reject'] }
                message: { type: string }
      responses:
        '200':
          description: Response recorded
  /chat/sessions:
    post:
      summary: Create chat session (user <-> agency)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                agency_id: { type: string }
                lead_id: { type: string }
      responses:
        '201':
          description: session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
  /chat/sessions/{sessionId}/messages:
    post:
      summary: Post message to session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                text: { type: string }
                attachments: 
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: message posted
  /calls/initiate:
    post:
      summary: Initiate a bridged call between user and agency (Twilio)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: { type: string }
                user_phone: { type: string }
                agency_phone: { type: string }
      responses:
        '202':
          description: call initiated; recording will be available later
  /webhooks/payment:
    post:
      summary: Payment gateway webhook listener
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: processed
security:
  - bearerAuth: []
